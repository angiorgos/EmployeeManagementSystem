<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
  <style> body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: white; } #container { width: 99%; height: 99%; margin: auto; position: relative; } </style>
</head>
<body>
<div id="container"><canvas id="chart"></canvas></div>
<script>
  let chartInstance = null;
  window.updateChart = function(labels, data) {
    const ctx = document.getElementById('chart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          // Παλέτα "Cool Blues"
          backgroundColor: ['#2563EB', '#3B82F6', '#60A5FA', '#94A3B8', '#CBD5E1'],
          borderWidth: 2,
          borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        legend: { position: 'right', labels: { usePointStyle: true, boxWidth: 8, padding: 15, fontColor: '#64748B' } },
        cutoutPercentage: 70
      }
    });
  };
</script>
</body>
</html>
