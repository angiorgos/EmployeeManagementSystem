<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
  <style> body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: white; } #container { width: 99%; height: 99%; margin: auto; position: relative; } </style>
</head>
<body>
<div id="container"><canvas id="chart"></canvas></div>
<script>
  let chartInstance = null;
  window.updateChart = function(labels, data) {
    const ctx = document.getElementById('chart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Count',
          data: data,
          // Minimal Blue
          borderColor: '#3B82F6',
          backgroundColor: 'rgba(59, 130, 246, 0.05)', // Πολύ αχνό γέμισμα
          borderWidth: 2,
          pointRadius: 3,
          pointBackgroundColor: '#3B82F6',
          pointBorderColor: '#fff',
          fill: true
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, legend: { display: false },
        scales: {
          yAxes: [{ ticks: { beginAtZero: true, precision: 0 }, gridLines: { color: '#F3F4F6' } }],
          xAxes: [{ gridLines: { display: false } }]
        },
        elements: { line: { tension: 0.3 } } // Smooth curves
      }
    });
  };
</script>
</body>
</html>
